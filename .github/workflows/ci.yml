name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: Lint, Build & Test
        runs-on: ubuntu-latest

        # A throwaway Postgres for the integration tests (tests/integration).
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: soupi_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Type-check tests and seed
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Integration tests (household scoping)
              run: npm run test:integration
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soupi_test
